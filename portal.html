<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>林建DX 業務管理ポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F8FAFC;
      --sidebar-bg: #FFFFFF;
      --accent-color: #059669;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --border-color: rgba(0,0,0,0.1);
      --ha-accent: #0891b2;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .font-mono-num {
      font-family: 'Roboto Mono', monospace;
    }

    .sidebar {
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
    }

    .nav-item {
      transition: all 0.2s;
      border-radius: 0.75rem;
      color: var(--text-main);
      opacity: 0.7;
    }

    .nav-item:hover {
      background-color: rgba(0,0,0,0.05);
      opacity: 1;
    }

    .nav-item.active {
      background-color: var(--accent-color);
      color: white;
      opacity: 1;
      box-shadow: 0 4px 12px -2px rgba(0,0,0,0.1);
    }

    .main-viewport {
      height: calc(100vh - 4rem);
      width: 100%;
      border: none;
      border-radius: 1rem 0 0 0;
      background: white;
      box-shadow: -4px 0 15px rgba(0,0,0,0.05);
    }

    .bento-header {
      height: 4rem;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      justify-content: space-between;
    }
  </style>
</head>
<body class="flex h-screen">

  <!-- サイドバー -->
  <aside class="sidebar w-64 flex flex-col transition-all">
    <div class="p-6">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span class="w-3 h-8 rounded-full bg-[var(--accent-color)]"></span>
        林建DXポータル
      </h1>
      <p class="text-[10px] opacity-50 mt-1 uppercase tracking-tighter font-bold">Administrative Dashboard</p>
    </div>

    <nav class="flex-grow px-4 space-y-2">
      <button onclick="loadApp('chiseki', this)" class="nav-item active w-full flex items-center gap-3 px-4 py-3 text-left">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A2 2 0 013 15.482V6.518a2 2 0 011.553-1.956L9 2l5.447 2.724A2 2 0 0115 6.518v8.964a2 2 0 01-1.553 1.956L9 20z"></path></svg>
        <span class="font-bold">施業地登録</span>
      </button>

      <button onclick="loadApp('genbakanri', this)" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-left">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="font-bold">現場管理</span>
      </button>

      <button onclick="loadApp('bunseki', this)" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-left">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        <span class="font-bold">データインポート・分析</span>
      </button>

      <button onclick="loadApp('shikirisho', this)" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-left">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        <span class="font-bold">仕切り書登録</span>
      </button>
    </nav>

    <div class="p-4 border-t border-[var(--border-color)]">
      <div class="bg-[var(--bg-color)] p-3 rounded-xl border border-[var(--border-color)]">
        <p class="text-[10px] opacity-60 font-bold mb-1 uppercase">Current Status</p>
        <div id="clock" class="text-lg font-mono-num font-bold">00:00:00</div>
      </div>
    </div>
  </aside>

  <!-- メインエリア -->
  <main class="flex-grow flex flex-col">
    <header class="bento-header">
      <div id="breadcrumb" class="text-sm font-bold opacity-60 flex items-center gap-2">
        Main Portal / <span id="current-app-name" class="text-[var(--text-main)] opacity-100">施業地登録</span>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="w-8 h-8 rounded-full bg-gray-300 overflow-hidden border border-[var(--border-color)]">
          <svg fill="currentColor" viewBox="0 0 24 24" class="text-gray-500"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
      </div>
    </header>

    <div class="flex-grow p-0">
      <iframe id="app-iframe" class="main-viewport" src="about:blank"></iframe>
    </div>
  </main>

  <script>
    // 子アプリのURL設定
    const APP_URLS = {
      chiseki: "https://script.google.com/macros/s/AKfycbyrJ727ZGDIk2bOJLQT7ckOIxhjlmuAMe8I9xmqJ2K5y6fh_yYA2_o9dtPNvtyepye--Q/exec",//バージョン36
      genbakanri: "https://script.google.com/a/macros/kikoriya.info/s/AKfycbwmrP2U08oithcv9g9zTK6xlr3W5oHe6I-OFAKGSkwTzxpiFvhfIYLcwN6Cl3wHBEra/exec",//バージョン49
      bunseki: "https://script.google.com/a/macros/kikoriya.info/s/AKfycbxj0yyBjzpcqN-iIoRODLCUcsarVTLWFdwCVP9oqsDWaAfYd05ZHPucrXE6WwMkAXRxoA/exec",//バージョン27
      shikirisho:"https://script.google.com/a/macros/kikoriya.info/s/AKfycbwzspzs_-UBPZOnOMBCgTn5z6uXklACLxlbjM-zOA7fPEz8MI9Y4Igmrg1LCECMYiHNFQ/exec"//バージョン25
    };

    // アプリ読み込み関数
    function loadApp(appKey, btn) {
      const iframe = document.getElementById('app-iframe');
      const url = APP_URLS[appKey];
      
      if (!url) {
        alert("このアプリは現在準備中です。");
        return;
      }

      // サイドバーのスタイル更新
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');

      // パンくずリスト更新
      document.getElementById('current-app-name').innerText = btn.innerText.trim();

      // iframe読み込み
      iframe.src = url;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('ja-JP', { hour12: false });
    }

    // 初期化処理
    window.onload = () => {
      // 1. 時計開始
      setInterval(updateClock, 1000);
      updateClock();

      // 2. 最初のアプリを loadApp 経由で読み込む
      const initialBtn = document.querySelector('.nav-item.active');
      if (APP_URLS.chiseki) {
        loadApp('chiseki', initialBtn);
      }
    };
  </script>
</body>
</html>
